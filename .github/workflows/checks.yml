name: Check drive
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -t sasu-drive:test .
  windows-offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: >-
          python -m pip download --dest wheels --platform win_amd64 --python-version 313 --implementation cp --abi cp313 --only-binary=:all: -r requirements.txt colorama==0.4.6
      - run: Invoke-WebRequest https://www.python.org/ftp/python/3.13.16/python-3.13.16-embed-amd64.zip -OutFile python-windows.zip
      - run: python scripts/build-offline-windows.py --python-zip python-windows.zip --wheels wheels --output offline-output/Nyuukoria-Drive-Offline-Windows.zip
      - run: python scripts/smoke-local-windows.py offline-output/Nyuukoria-Drive-Offline-Windows.zip
